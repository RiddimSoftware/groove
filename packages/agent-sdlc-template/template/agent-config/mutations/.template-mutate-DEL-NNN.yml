name: mutate-DEL-NNN

# IMPORTANT: After this mutation has been run and verified on 'main',
# create a follow-up PR to DISABLE this workflow.
# Do not delete the file; disabling preserves the audit trail in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running this mutation'
        required: true
        default: 'Manual trigger for DEL-NNN'
      dry_run:
        description: 'If true, do not apply changes'
        required: true
        type: boolean
        default: true

jobs:
  mutate:
    name: Execute Mutation
    runs-on: ubuntu-latest
    
    # Minimum viable permissions. 
    # If your mutation script needs more (e.g., 'environments: write'), 
    # add them here in your implementation PR.
    permissions:
      contents: read

    steps:
      - name: Execute Mutation
        # A single job step that runs the mutation script.
        # We perform a shallow clone of the repo in-step to avoid a separate checkout step.
        run: |
          # Fetch the mutation script from the repository
          gh repo clone "$REPO" . -- --depth 1
          
          # Run the mutation script
          bash mutations/DEL-NNN-slug.sh
        env:
          # Use the default GitHub token for API access.
          # If the mutation requires higher privileges (e.g., org-level),
          # use a custom secret instead.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REASON: ${{ github.event.inputs.reason }}
