# Tool-neutral routing catalog for repositories under /YOUR/WORKSPACE/DIR.
# This file helps agents pick the right repo before they load repo-local context.
# Keep entries factual and compact; detailed project knowledge belongs in each repo.
#
# linear_team: the Linear team that owns this repository. Issues for this repo
# belong in this team. Cross-team repository overrides are disallowed.

version: 1
workspace: /YOUR/WORKSPACE/DIR
default_github_owner: YourGithubOrg
catalog_style: routing_plus_bootstrap

repositories:
  - name: agent-config
    linear_team: AGENT
    path: /YOUR/WORKSPACE/DIR/agent-config
    remote: git@github.com:YourGithubOrg/agent-config.git
    default_branch: main
    aliases:
      - org instructions
      - agent config
      - AGENTS.md
      - CLAUDE.md
      - context layer
      - RID
      - S2S
    context_files:
      - CLAUDE.md
      - AGENTS.md
      - context/README.md
      - context/repositories.yaml
    bootstrap_markers: []

  - name: aso
    linear_team: ASO
    path: /YOUR/WORKSPACE/DIR/aso
    remote: git@github.com:YourGithubOrg/aso.git
    default_branch: main
    aliases:
      - aso
      - ASO
      - app store optimization
      - store automation
    context_files: []  # CLAUDE.md and README.md absent; aso rollout issue will add CLAUDE.md when created
    bootstrap_markers:
      - pyproject.toml

  - name: autopilot
    linear_team: AUTO
