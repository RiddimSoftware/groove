tracker:
  kind: linear
  endpoint: https://api.linear.app/graphql
  api_key: $LINEAR_API_KEY
  api_key_aws_secret:
    secret_id: linear/api-key
    profile: your-aws-profile
    region: us-east-1
  active_states: [Todo, In Progress, In Review]
  terminal_states: [Done, Canceled, Cancelled, Duplicate]
  # Issues carrying any of these labels are excluded from the agent dispatch
  # candidate pool. `human-handoff` issues are now dispatch-eligible and
  # run under the prep contract: the empty-estimates HH bucket
  # in the developer role routes them to Opus 4.8 Low; the default agent
  # prompt suppresses commit/PR/branch-push instructions for the
  # `human-handoff` label. See context/human-handoff.md
  # § "Autonomous pre-closeout prep" for the full contract.
  dispatch_excluded_labels: [hh-prepared]
  stale_claim_reconciliation:
    enabled: true
    source_state: In Progress
    target_state: Todo
    idle_after_ms: 600000
    require_no_open_pr: true
    require_no_local_worker: true
    require_worktree: true
  linear_pr_phase_projection:
    enabled: true
    merged_pr_scan_interval_ms: 60000
    managed_linear_states:
      - Todo
      - In Progress
      - In Review
    phase_to_linear_state:
      draft: In Progress
      ci_pending: In Progress
      ci_failed: In Progress
      review_pending: In Review
      ready_to_merge: In Review
      changes_requested: In Progress
      merge_conflict: In Progress
      merge_queue_waiting: In Review
      automerge_armed: In Review
      mergeability_unknown: In Progress
      human_action_required: In Progress
      blocked_or_human_gate: In Progress
      merged: Done
      closed_unmerged: Todo
polling:
  interval_ms: 60000
  linear:
    candidate_refresh_ms: 60000
    issue_hydration_refresh_ms: 120000
    state_refresh_ms: 60000
    error_cooldown_ms: 60000
  github:
    candidate_refresh_ms: 120000
    issue_read_refresh_ms: 120000
    open_pr_refresh_ms: 120000
    repair_scan_ms: 60000
    error_cooldown_ms: 60000
provider_webhook_relay:
  enabled: true
  path_prefix: /webhook
  linear:
    events:
      - Issue
      - Comment
      - Project
      - Cycle
      - Label
    signature:
      header: Linear-Signature
      delivery_id_header: Linear-Delivery
      aws_secret:
        secret_id: symphony/linear-webhook-signing-secret
        profile: your-aws-profile
        region: us-east-1
  github:
    events:
      - pull_request
      - pull_request_review
      - pull_request_review_comment
      - pull_request_review_thread
      - check_run
      - status
      - workflow_run
      - push
      - issue_comment
    signature:
      header: X-Hub-Signature-256
      delivery_id_header: X-GitHub-Delivery
      aws_secret:
        secret_id: symphony/github-webhook-signing-secret
        profile: your-aws-profile
        region: us-east-1
provider_event_inbox:
  adapter: filesystem
  mcp_url: http://127.0.0.1:8785/mcp
  sqlite_path: .symphony/provider-events.db
  dedupe:
    delivery_id_ttl_ms: 604800000
  retention:
    offline_hours: 72
    max_events_per_provider: 5000
reviewer:
  enabled: false
  polling_interval_ms: 30000
  reserved_agent_slots: 0
  bot_identity_helper_path: /YOUR/WORKSPACE/DIR/agent-config/bin/gh-app-token
  opener_allowlist:
    - riddim-developer-bot
    - app/riddim-developer-bot
developer:
  pr_fix_reserved_agent_slots: 0
workspace:
  root: ./.symphony/workspaces
  repository_root: .
  base_branch: main
  branch_prefix_template: symphony
  use_git_worktree: true
  require_clean_root: false
hooks:
  timeout_ms: 60000
llm:
  # Default-provider is the last resort when no `providers` weights are
  # configured. With the weights below it is rarely consulted.
  default_provider: claude

  # Shared pool — every provider is enabled at equal weight so the weighted
  # random pick distributes across all five vendors. To take a provider out
  # of rotation for a single role, override at `roles.<role>.providers`
  # below; to disable globally drop its weight here to 0.
  providers:
    - { name: codex,  weight: 0 }
    - { name: claude, weight: 1 }
    - { name: gemini, weight: 0 }
    - { name: cursor, weight: 0 }
    - { name: kimi,   weight: 0 }

  # Per-role declarations (AUTO-711). Each role carries its own copy of the
  # bucket layout so developer + reviewer can diverge independently. Today
  # the two role blocks are identical; tweak one without touching the other
  # when you want to specialize. Resolution order (per field):
  #   role bucket → role per-row → shared bucket → shared per-row → default
  roles:
    developer:
      buckets:
        - name: S
          estimates: [1, 2]
          models:
            codex:  { all: gpt-5.5 }
            claude: { all: claude-opus-4-7 }
            cursor: { all: auto }
          effort:
            codex: { all: high }
            claude: { all: max }

        - name: M
          estimates: [4]
          models:
            codex:  { all: gpt-5.5 }
            claude: { all: claude-opus-4-8 }
          effort:
            codex:  { all: xhigh }
            claude: { all: max }

        - name: L
          estimates: [8, 16]
          models:
            codex:  { all: gpt-5.5 }
            claude: { all: claude-fable-5 }
          effort:
            codex:  { all: xhigh }
            claude: { all: max }

        - name: HH
          estimates: []
          providers:
            - { name: codex,  weight: 0 }
            - { name: claude, weight: 1 }
            - { name: gemini, weight: 0 }
            - { name: cursor, weight: 0 }
            - { name: kimi,   weight: 0 }
          models:
            claude: { all: claude-opus-4-8 }
          effort:
            claude: { all: low }

github:
  enrichment_identity: developer
agent:
  max_concurrent_agents: 4
  per_tick_dispatch_ceiling: 1
  max_turns: 20
  max_retry_backoff_ms: 300000
  max_resume_attempts: 5
  max_fix_attempts: 3
  github_bot:
    enabled: true
    path_prefix: /YOUR/WORKSPACE/DIR/agent-config/bin
    aws_profile: your-aws-profile
    expected_login: riddim-developer-bot[bot]
    git_author_name: riddim-developer-bot
    git_author_email: developer-bot@riddimsoftware.com
  reviewer_bot:
    enabled: true
    path_prefix: /YOUR/WORKSPACE/DIR/agent-config/bin
    aws_profile: your-aws-profile
    expected_login: riddim-reviewer-bot[bot]
    git_author_name: riddim-reviewer-bot
    git_author_email: reviewer-bot@riddimsoftware.com
codex:
  command: codex app-server
  approval_policy: { mode: never }
  thread_sandbox: { mode: danger-full-access }
  turn_sandbox_policy: { mode: danger-full-access }
  turn_timeout_ms: 3600000
  read_timeout_ms: 5000
  stall_timeout_ms: 300000
claude:
  command: /Users/your_username/.local/bin/claude --dangerously-skip-permissions -p
  turn_timeout_ms: 3600000
gemini:
  command: true --yolo --skip-trust --output-format ; /Users/your_username/.local/bin/agy --dangerously-skip-permissions --add-dir /YOUR/WORKSPACE/DIR/ --model "Gemini 3.1 Pro (High)" -p
  skip_trust: true
  turn_timeout_ms: 3600000
cursor:
  command: cursor-agent
kimi:
  command: kimi --print --yolo
  turn_timeout_ms: 3600000
coordinator:
  enabled: true
  url: http://127.0.0.1:8785/mcp
  # fallback_mode: standalone — symphonyd continues self-managed when the
  # coordinator is unreachable. Set to "error" to require coordinator assignment.
  fallback_mode: standalone
  heartbeat_interval_ms: 30000
  poll_interval_ms: 30000
  # Capacity is not configured here. The coordinator live policy (mcpd.db)
  # is the sole authority. Set or adjust capacity via the console:
  #   PATCH /coordinator/capacity
  # workflow.local.yml is no longer the capacity path.

## Context and test discipline
#
# Context discipline:
# When the issue description's `## Inputs / dependencies` section names specific
# files, read those files first. Treat them as your complete starting context.
# Do not read additional files speculatively; use targeted `rg` searches if you
# need more.
#
# Test discipline:
# Always run the most targeted filter possible: `swift test --filter <SpecificTestSuite>`.
# Never run bare `swift test` unless the AC explicitly requires full-suite
# verification. Capture output with `2>&1 | grep -E "(error:|FAILED|✗|Test Suite.*failed)" | head -60`
# to avoid flooding context.
