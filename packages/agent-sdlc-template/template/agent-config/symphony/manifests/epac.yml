team_key: EPAC
repo_name: epac
repository_path: /YOUR/WORKSPACE/DIR/epac
verification_command: "Run `cd ios && make build`. See the Verification Expectations section for area-specific commands."
server_port: 4781
extends_path: ../shared.yml
local_prompt_sections:
  - id: ui_flows_user_journeys
    title: UI Flows and User Journeys
    body: |
      When adding or updating a UI flow or user journey, treat the full path a
      user takes as the behavioral contract. A journey includes the entry point,
      navigation actions, async loading states, final visible state, and the
      relevant empty or error state.

      Required workflow:

      - Add or update an end-to-end UI test for every changed journey. For iOS,
        prefer XCUITest under `ios/epacUITests`; do not rely only on unit tests,
        repository tests, snapshots, or manual screenshots.
      - Drive the app through the same navigation a user takes. Assert the final
        screen has meaningful visible content, not just that a view was pushed.
      - Use mocked data, local fixtures, or an evidence-mode fixture whenever
        practical so the journey is deterministic in CI. Mock only the true edge
        of the system; keep the real view, navigation, view model, decoding, and
        rendering path under test.
      - If a deterministic mock or fixture seam does not exist, either add one in
        the same PR or explain the gap in the PR and create a follow-up. Live
        staging checks are useful evidence but are not a substitute for the
        committed UI journey test.
      - For bug fixes, first make the UI test reproduce the reported failure, then
        make the smallest product change that turns the test green. Keep that test
        committed so the regression stays covered.
      - When a journey depends on a backend response shape, update any fixture,
        mock, OpenAPI contract, and decoding assertions needed for the UI test to
        cover the current contract.

      Verification notes:

      - Run the narrowest UI test filter that covers the journey, such as
        `xcodebuild test ... -only-testing:epacUITests/<Suite>/<testName>`, before
        broader build checks.
      - Attach or cite the passing UI-test screenshot or result bundle evidence
        when the change affects visible UI.
