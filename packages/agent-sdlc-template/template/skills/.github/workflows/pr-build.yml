name: pr-build

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: YourGithubOrg/riddim-release/.github/workflows/lint-check.yml@main

  pr-build:
    name: pr-build
    needs: [build]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Check build passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            exit 1
          fi
